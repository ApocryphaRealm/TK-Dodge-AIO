; TK Dodge AIO - settings. Edit here or on the Apocrypha Menu Framework page (Mod Control Panel > TK Dodge AIO).
; Same key names as the TK Dodge RE Addon's tk-dodge.toml.

[Settings]
bStepDodge = false
bEnableDodgeInPlace = true
sDefaultDodgeEvent = "TKDodgeBack"
bRemoveForwardDodge = false
bDisableInThird = false
fIFrameDuration = 0.30
; Key codes: 0-255 keyboard (DirectInput scan code), 256+ mouse, 266+ controller; 1 = unbound. 42 = Left Shift.
uDodgeKey = 42
bUseDoubleTap = false
bUseSprintKey = false
fSprintingPressDuration = 0.50
bEnableSneakKeyDodge = false
fSneakingPressDuration = 0.50
fDodgeCost = 15.00
bUsePercentageCost = false
bEnableDodgeAttackCancel = true
bOnlyCancelLightAttacks = false
bUseMCORecoverWindow = false
bEnableSneakDodge = false
bUsePerkLock = false

[Forms]
; "Plugin.esp|0x800" (local form ID) or an EditorID
sDodgeRequiredPerkID = "TKDodgeAddon.esp|0x809"
sOnDodgeSpellID = "OnDodgeDummySpell"
sOnDodgeSpellRequiredPerkID = "TKDodgeAddon.esp|0x80F"

[Debug]
; 0 trace (everything - the default), 1 debug, 2 info, 3 warn, 4 error, 5 critical, 6 off
uLogLevel = 0
